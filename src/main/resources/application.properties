spring.application.name=BackupRecovery

# Secrets come from environment variables, never from the file
spring.datasource.url=jdbc:postgresql://localhost:5432/hebhzi_db
spring.datasource.username=hebhzi_user
spring.datasource.password=${DB_PASSWORD}

# schema.sql creates the table; Hibernate only checks it matches the entity
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Health check used later to decide "recovery complete"
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always